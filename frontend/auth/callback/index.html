    <title>Authenticating — Prepo.ai</title>

        // Forward URL query and hash parameters back to the root application
        // so Supabase Auth SDK can detect the access token and establish the session.
        window.location.href = "/" + window.location.search + window.location.hash;
    </script>
</head>

    </div>
</body>
</html>
